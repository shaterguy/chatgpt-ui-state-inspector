<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT UI State Inspector</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="eyebrow">CHRONOLOGICAL RECORDER</div>
    <h1>ChatGPT UI State Inspector</h1>
    <p>한 번 시작하면 전환·선택·반복 클릭과 UI 변화를 한 세션에 순서대로 기록합니다.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="record-heading">
      <h2 id="record-heading">연속 기록</h2>
      <label for="session-title">기록 제목</label>
      <input id="session-title" maxlength="80" placeholder="예: 워크모드" autocomplete="off">
      <div class="button-row">
        <button id="start" class="primary">기록 시작</button>
        <button id="stop" class="danger" disabled>기록 종료</button>
      </div>
      <div id="live-status" class="status" role="status" aria-live="polite">대기 중</div>
      <ol id="recent-events" class="recent" aria-label="최근 기록 이벤트"></ol>
    </section>

    <section class="card" aria-labelledby="sessions-heading">
      <div class="section-title">
        <h2 id="sessions-heading">저장된 세션</h2>
        <button id="refresh" class="ghost">새로고침</button>
      </div>
      <div id="sessions" class="sessions"></div>
    </section>

    <section class="notice">
      <strong>개인정보 보호</strong>
      <p>입력값과 대화 본문은 저장하지 않습니다. 기록은 이 확장프로그램의 로컬 저장소에만 남고 외부로 전송되지 않습니다.</p>
    </section>
  </main>

  <template id="session-template">
    <article class="session">
      <div class="session-head">
        <div>
          <h3 class="session-title"></h3>
          <p class="session-meta"></p>
        </div>
        <span class="badge"></span>
      </div>
      <div class="session-actions">
        <label>
          <span class="sr-only">내보내기 형식</span>
          <select class="format">
            <option value="json">JSON</option>
            <option value="jsonl">JSONL</option>
            <option value="csv">CSV</option>
            <option value="md">Markdown</option>
          </select>
        </label>
        <button class="export">파일 저장</button>
        <button class="delete ghost">삭제</button>
      </div>
    </article>
  </template>

  <script src="sidepanel.js"></script>
</body>
</html>
